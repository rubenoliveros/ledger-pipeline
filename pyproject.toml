[project]
name = "ledger-pipeline"
version = "0.1.0"
description = "ERP-to-consolidation ledger pipeline with staging and audit schemas, idempotent reruns and a reproducible load benchmark."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rubén Oliveros", email = "ruben.oliveros@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mssql: needs a running SQL Server (LEDGER_MSSQL_CONN)"]
